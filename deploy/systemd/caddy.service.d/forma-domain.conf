# Caddy runs as its own service and never reads /etc/forma/forma.env, so
# {$FORMA_DOMAIN} in the Caddyfile resolves against *Caddy's* environment. This
# drop-in is what puts it there.
#
# A file of its own, not forma.env: that one holds FORMA_REMOTE_TOKEN, and Caddy
# has no business with the credential. It proxies; the two Forma processes check
# the token themselves.
#
# Install as /etc/systemd/system/caddy.service.d/forma-domain.conf
[Service]
EnvironmentFile=/etc/forma/domain.env
