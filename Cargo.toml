[workspace]
resolver = "2"
members = [
    "apps/mcp",
    "apps/server",
    "crates/application",
    "crates/assets",
    "crates/design-core",
    "crates/renderer",
    "crates/persistence",
    "crates/validator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
application = { path = "crates/application" }
assets = { path = "crates/assets" }
design-core = { path = "crates/design-core" }
renderer = { path = "crates/renderer" }
validator = { path = "crates/validator" }
persistence = { path = "crates/persistence" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# no-serde-warnings silences ts-rs complaining about serde attrs it ignores
# (e.g. `transparent`), which we already override with an explicit ts type.
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }
# The same font parser usvg shapes with, so our glyph-coverage answers and its
# own cannot disagree. Pinned to the version usvg resolves: one copy in the tree.
skrifa = "0.44"
usvg = "0.48.1"
resvg = "0.48.1"

actix-web = "4.15"
actix-files = "0.6"
# default-features off drops the tempfile-backed field store: uploads are
# size-capped and handled in memory, so nothing needs to touch disk before the
# magic-byte check has run.
actix-multipart = { version = "0.7", default-features = false }
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmcp = { version = "3.1", features = ["server", "macros", "transport-io", "base64"] }
schemars = "1"
anyhow = "1"
tempfile = "3"
base64 = "0.22"
actix-http = "3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
blake3 = "1"
