[workspace]
resolver = "2"
members = [
    "crates/design-core",
    "crates/renderer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
design-core = { path = "crates/design-core" }
renderer = { path = "crates/renderer" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
usvg = "0.48.1"
resvg = "0.48.1"
