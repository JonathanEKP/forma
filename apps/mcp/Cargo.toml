[package]
name = "forma-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forma-mcp"
path = "src/main.rs"

[dependencies]
axum.workspace = true
blake3.workspace = true
rmcp.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
base64.workspace = true
uuid.workspace = true

[dev-dependencies]
design-core.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
# The acceptance test drives the real MCP binary against a real forma-server,
# because the seam between them is where this phase can actually be wrong.
forma-server = { path = "../server" }
actix-web.workspace = true
persistence.workspace = true
renderer.workspace = true
tempfile.workspace = true
reqwest.workspace = true
resvg.workspace = true
sqlx.workspace = true
