name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# Supersede in-flight runs on the same ref. On a private repo those minutes are
# billed, and a run for an overwritten commit is never worth paying for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Without this every run recompiles actix, sqlx, resvg and rmcp from
      # scratch, which is most of the wall clock and most of the cost.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # This covers the renderer golden tests of plan section 63 too, once they
      # exist: they are ordinary workspace tests, not a separate runner.
      - name: Test
        run: cargo test --workspace

      # Plan section 30: ts-rs exports during the test run above, so a drifted
      # binding shows up here as a dirty working tree.
      - name: Bindings are current
        run: ./scripts/check-bindings.sh

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Plan section 69: the lockfile is the build input, never a suggestion.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Plan section 67. Separate from the web job because it needs the Rust binary
  # too, and because a browser download is worth caching on its own.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ~115 MB, and it does not change between runs.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the browser
        run: pnpm e2e:install --with-deps

      # The walkthrough drives the real server serving the real built app.
      - name: Build the server
        run: cargo build --bin forma-server

      - name: Build the app
        run: pnpm build

      - name: Walk the Definition of Done
        run: pnpm e2e

      - name: Keep the trace of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: e2e/test-results/
          retention-days: 7
